[package]
name = "srpc"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]
members = ["rusty-cpp-markers", "rusty-rustc"]
resolver = "2"

[lib]
path = "src/lib.rs"

[dependencies]
rusty = { path = "rusty-rustc" }

[lints.rust]
unsafe_code = "deny"
# `verus` is the verification-only cfg set by scripts/verify_srpc.sh; declare
# it so `cargo` under -Dwarnings does not flag `#[cfg(verus)]` as unexpected.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus)'] }
